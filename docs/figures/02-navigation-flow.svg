<text x="70" y="788" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#18334b">仅当前 goal_id 的 SUCCEEDED 可报告 REACHED；旧结果、发送成功都不能算到达。</text>
<text x="70" y="820" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#18334b">Action 结果不能单独证明物理停车；真实轨迹、终点位姿和停止还需仿真验证。</text>
<text x="48" y="907" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#986009">GlobalPlanner 参数存在 ≠ 插件被选择；TEB 在配置中显式选择，但尚未动态验证。</text>
<text x="48" y="963" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#51667a">依据：02-fastlio-navigation.md；桥接与反馈是控制链及逻辑返回关系，图中不表示桥接产生 Action 结果。</text>
